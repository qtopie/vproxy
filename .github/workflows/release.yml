name: CI/CD Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies (Linux eBPF)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev

      - name: Run Go Generate
        run: |
          # Ensure bpf2go tool is available and generate eBPF code
          go run github.com/cilium/ebpf/cmd/bpf2go -target bpfel -tags "linux,!android" -output-dir proxy/ebpf bpf proxy/ebpf/bpf/redirect.c
          go run github.com/cilium/ebpf/cmd/bpf2go -target bpfel -tags "linux,!android" -output-dir proxy/ebpf tc_bpf proxy/ebpf/bpf/tc_redirect.c

      - name: Run Tests
        run: go test -v ./...

      - name: Build Check (Linux)
        run: go build -v ./...

      - name: Build Check (macOS)
        run: GOOS=darwin GOARCH=amd64 go build -v ./...

      - name: Build Check (Windows)
        run: GOOS=windows GOARCH=amd64 go build -v ./...

  release:
    name: Build & Release Packages
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies (Linux eBPF)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev

      - name: Run Go Generate
        run: |
          go run github.com/cilium/ebpf/cmd/bpf2go -target bpfel -tags "linux,!android" -output-dir proxy/ebpf bpf proxy/ebpf/bpf/redirect.c
          go run github.com/cilium/ebpf/cmd/bpf2go -target bpfel -tags "linux,!android" -output-dir proxy/ebpf tc_bpf proxy/ebpf/bpf/tc_redirect.c

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
