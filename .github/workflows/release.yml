name: CI/CD Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies (Linux eBPF)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev gcc-multilib
          sudo ln -s /usr/include/x86_64-linux-gnu/asm /usr/include/asm

      - name: Run Go Generate
        run: task generate

      - name: Verify Generated Files
        run: |
          ls -l proxy/ebpf/bpf_bpfel.go
          ls -l proxy/ebpf/bpf_bpfel.o
          ls -l proxy/ebpf/tc_bpf_bpfel.go
          ls -l proxy/ebpf/tc_bpf_bpfel.o

      - name: Run Tests
        run: go test -v ./...

      - name: Build Check
        run: task default

  release:
    name: Build & Release Packages
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies (Linux eBPF)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev gcc-multilib
          sudo ln -s /usr/include/x86_64-linux-gnu/asm /usr/include/asm

      - name: Run Go Generate
        run: task generate

      - name: Build Release Binaries
        run: task release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.CI_TOKEN }}
