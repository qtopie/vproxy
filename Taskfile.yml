version: '3'

vars:
  BINARY_NAME: vproxy

tasks:
  default:
    desc: Build the vproxy binary
    cmds:
      - go build -o bin/{{.BINARY_NAME}} ./cmd/vproxy

  clean:
    desc: Clean up build artifacts
    cmds:
      - rm -rf bin/{{.BINARY_NAME}} bin/test_*

  build-tests:
    desc: Build all test binaries
    cmds:
      - go build -o bin/test_direct ./cmd/test/direct
      - go build -o bin/test_upstream ./cmd/test/upstream
      - go build -o bin/test_ebpf ./cmd/test/ebpf
      - go build -o bin/test_tproxy ./cmd/test/tproxy
      - go build -o bin/test_google ./cmd/test/google

  test-network:
    desc: Run network connectivity tests
    deps: [build-tests]
    cmds:
      - echo "=========================================="
      - echo "Running Direct Network Test..."
      - ./bin/test_direct || true
      - echo "=========================================="
      - echo "Running Upstream Proxy Test..."
      - ./bin/test_upstream || true
      - echo "=========================================="

  generate:
    desc: Run go generate to build eBPF assets
    cmds:
      - go generate ./...

  release:
    desc: Build and package release binaries for all platforms
    cmds:
      - rm -rf dist && mkdir -p dist
      # Linux amd64
      - GOOS=linux GOARCH=amd64 go build -o dist/vproxy ./cmd/vproxy
      - tar -czf dist/vproxy_linux_amd64.tar.gz -C dist vproxy
      # Linux arm64
      - GOOS=linux GOARCH=arm64 go build -o dist/vproxy ./cmd/vproxy
      - tar -czf dist/vproxy_linux_arm64.tar.gz -C dist vproxy
      # Darwin amd64
      - GOOS=darwin GOARCH=amd64 go build -o dist/vproxy ./cmd/vproxy
      - tar -czf dist/vproxy_darwin_amd64.tar.gz -C dist vproxy
      # Darwin arm64
      - GOOS=darwin GOARCH=arm64 go build -o dist/vproxy ./cmd/vproxy
      - tar -czf dist/vproxy_darwin_arm64.tar.gz -C dist vproxy
      # Windows amd64
      - GOOS=windows GOARCH=amd64 go build -o dist/vproxy.exe ./cmd/vproxy
      - zip -j dist/vproxy_windows_amd64.zip dist/vproxy.exe
      # Windows arm64
      - GOOS=windows GOARCH=arm64 go build -o dist/vproxy.exe ./cmd/vproxy
      - zip -j dist/vproxy_windows_arm64.zip dist/vproxy.exe
      # Cleanup individual binaries and generate checksums
      - rm -f dist/vproxy dist/vproxy.exe
      - cd dist && sha256sum * > checksums.txt
